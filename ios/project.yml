name: MyLibrary
options:
  bundleIdPrefix: com.personal.library
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
targets:
  MyLibrary:
    type: application
    platform: iOS
    sources:
      - path: MyLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.library.MyLibrary
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 我的藏书
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描图书 ISBN 条码
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于识别照片中的 ISBN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
