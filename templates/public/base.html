{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" sizes="64x64" href="{% static 'catalog/favicon.png' %}?v=20261120-shuyu">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'catalog/apple-touch-icon.png' %}?v=20261120-shuyu">
  <title>{% block title %}{% endblock %} · 书隅</title>
  <style>
    :root { color-scheme: light dark; --paper: #faf8f4; --ink: #282e29; --accent: #874533; --line: #d9d5ce; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.85 system-ui, -apple-system, sans-serif; }
    .page { max-width: 760px; margin: auto; padding: 32px 24px 72px; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; border-bottom: 1px solid var(--line); padding-bottom: 22px; }
    nav strong { display: inline-flex; align-items: center; gap: 10px; margin-right: auto; font-size: 24px; }
    nav strong img { display: block; border-radius: 8px; }
    a { color: var(--accent); text-underline-offset: 4px; overflow-wrap: anywhere; }
    nav a { display: inline-block; min-height: 44px; line-height: 44px; }
    h1 { font-size: 32px; line-height: 1.35; margin: 44px 0 12px; }
    h2 { font-size: 21px; line-height: 1.5; margin: 32px 0 10px; }
    p, ul, ol { margin: 12px 0; }
    li { margin: 8px 0; }
    .meta, footer { font-size: 14px; opacity: .8; }
    footer { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 20px; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1b1f1c; --ink: #f0eee8; --accent: #e6a58c; --line: #454b45; } }
  </style>
</head>
<body>
<div class="page">
  <nav aria-label="书隅帮助"><strong><img src="{% static 'catalog/logo.png' %}?v=20261120-shuyu" width="32" height="32" alt="">书隅</strong><a href="{% url 'support' %}">帮助与反馈</a><a href="{% url 'privacy' %}">隐私政策</a><a href="{% url 'terms' %}">使用条款</a></nav>
  <main>{% block content %}{% endblock %}</main>
  <footer>书隅 · 整理你的实体藏书{% if operator_name %}<br>运营者：{{ operator_name }}{% endif %}{% if support_email %}<br>联系邮箱：<a href="mailto:{{ support_email }}">{{ support_email }}</a>{% endif %}</footer>
</div>
</body>
</html>
