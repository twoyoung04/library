{% load static %}
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 藏书簿</title><link rel="stylesheet" href="{% static 'catalog/style.css' %}"></head>
<body class="login-body"><main class="login-card"><div class="login-icon">▥</div><p class="eyebrow">PERSONAL LIBRARY</p><h1>欢迎回到藏书簿</h1><p class="muted">你的书，按自己的方式收藏。</p>
{% if form.errors %}<p class="form-error">用户名或密码不正确。</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="id_username">用户名</label><input id="id_username" name="username" type="text" autocomplete="username" required autofocus><label for="id_password">密码</label><input id="id_password" name="password" type="password" autocomplete="current-password" required><button class="button primary full" type="submit">登录 →</button></form></main></body></html>
