name: library
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  db:
    image: postgres:${POSTGRES_MAJOR:?Set POSTGRES_MAJOR after checking the source dump}-bookworm
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d library']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  web: &web
    image: library-web:latest
    build:
      context: .
      target: app
    environment:
      DJANGO_ENV: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      DATABASE_URL: postgresql://library:${POSTGRES_PASSWORD}@db:5432/library
      DATABASE_SSLMODE: disable
      SHOWAPI_APP_KEY: ${SHOWAPI_APP_KEY:-}
      COS_ENABLED: ${COS_ENABLED:-0}
      COS_BUCKET: ${COS_BUCKET:-cover-1307828558}
      COS_REGION: ${COS_REGION:-ap-shanghai}
      COS_PUBLIC_BASE_URL: ${COS_PUBLIC_BASE_URL:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      JUHE_ISBN_KEY: ${JUHE_ISBN_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
  covers:
    <<: *web
    profiles: ['covers']
    command: ['python', 'manage.py', 'sync_covers', '--watch']
  nginx:
    build:
      context: .
      target: proxy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/nginx.${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certificates:/etc/letsencrypt:ro
      - acme:/var/www/acme:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging
  certbot:
    image: certbot/certbot:latest
    profiles: ['tools']
    volumes:
      - certificates:/etc/letsencrypt
      - acme:/var/www/acme
    logging: *logging
volumes:
  pgdata:
  certificates:
  acme:
